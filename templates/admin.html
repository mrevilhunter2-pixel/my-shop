<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Fashion Mart</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="navbar">
    <div class="logo">Admin Dashboard</div>
    <div class="nav-links">
      <button onclick="window.location.href='/'">Home</button>
      <button onclick="logoutAdmin()" style="background:red; color:white;">Logout</button>
    </div>
  </header>

  <div class="container" style="padding: 20px;">
    <h2>Add New Clothing Product</h2>
    <form onsubmit="addNewProduct(event)" style="background:#f9f9f9; padding:15px; border-radius:5px; margin-bottom:30px;">
      <div class="form-group"><input type="text" id="p-name" placeholder="Product Name" required style="width:100%; padding:8px;"></div>
      <div class="form-group" style="margin-top:10px;">
        <select id="p-cat" style="width:100%; padding:8px;">
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
        </select>
      </div>
      <div class="form-group" style="margin-top:10px;"><input type="number" id="p-price" placeholder="Original Price" required style="width:100%; padding:8px;"></div>
      <div class="form-group" style="margin-top:10px;"><input type="number" id="p-disc" placeholder="Discount Price" required style="width:100%; padding:8px;"></div>
      
      <div class="form-group" style="margin-top:10px;">
        <label>Product Photo 1 (Front View - Camera/Gallery):</label>
        <input type="file" id="p-img1" accept="image/*" required style="width:100%; padding:8px;">
      </div>
      <div class="form-group" style="margin-top:10px;">
        <label>Product Photo 2 (Side/Back View - Optional):</label>
        <input type="file" id="p-img2" accept="image/*" style="width:100%; padding:8px;">
      </div>

      <div class="form-group" style="margin-top:10px;"><textarea id="p-desc" placeholder="Product Description" style="width:100%; padding:8px;"></textarea></div>
      <button type="submit" class="submit-order-btn" style="margin-top:10px;">Add Product</button>
    </form>

    <h2>Manage Products (Delete)</h2>
    <div id="admin-products-container" style="margin-bottom: 30px;"></div>

    <h2>All Customer Orders</h2>
    <div id="admin-orders-container"></div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadAdminOrders();
      loadAdminProducts();
    });

    function loadAdminProducts() {
      fetch('/api/products')
      .then(res => res.json())
      .then(products => {
        const container = document.getElementById('admin-products-container');
        container.innerHTML = '';
        if(products.length === 0) {
          container.innerHTML = '<p>No products available.</p>';
          return;
        }
        products.forEach(p => {
          container.innerHTML += `
            <div style="display: flex; align-items: center; justify-content: space-between; border:1px solid #ccc; padding:10px; margin-bottom:8px; border-radius:5px; background:#fff;">
              <div style="display: flex; align-items: center; gap: 10px;">
                <img src="${p.images[0]}" width="50" height="50" style="object-fit:cover; border-radius:4px;">
                <div>
                  <h4>${p.name}</h4>
                  <p>₹${p.discountPrice} (${p.category})</p>
                </div>
              </div>
              <button onclick="deleteProduct(${p.id})" style="background:red; color:white; border:none; padding:6px 12px; cursor:pointer; border-radius:4px;">Delete Product</button>
            </div>
          `;
        });
      });
    }

    function deleteProduct(productId) {
      if(confirm("Are you sure you want to delete this product?")) {
        fetch(`/api/admin/delete-product/${productId}`, {method: 'DELETE'})
        .then(res => res.json())
        .then(data => {
          if(data.status === 'success') {
            alert("Product deleted successfully!");
            loadAdminProducts();
          }
        });
      }
    }

    function loadAdminOrders() {
      fetch('/api/admin/orders')
      .then(res => res.json())
      .then(orders => {
        const container = document.getElementById('admin-orders-container');
        container.innerHTML = '';
        if(orders.length === 0) {
          container.innerHTML = '<p>No orders received yet.</p>';
          return;
        }
        orders.forEach(o => {
          let itemsText = o.items.map(i => `${i.name} (x${i.qty})`).join(', ');
          container.innerHTML += `
            <div style="border:1px solid #ccc; padding:15px; margin-bottom:10px; border-radius:5px; background:#fff;">
              <p><strong>Order ID:</strong> #${o.id} | <strong>Date:</strong> ${o.date}</p>
              <p><strong>Customer:</strong> ${o.name} (${o.phone})</p>
              <p><strong>Address:</strong> ${o.address}</p>
              <p><strong>Items:</strong> ${itemsText}</p>
              <p><strong>Total:</strong> ₹${o.total}</p>
              <p><strong>Update Status:</strong> 
                <select onchange="updateStatus(${o.id}, this.value)">
                  <option value="Order Placed" ${o.status==='Order Placed'?'selected':''}>Order Placed</option>
                  <option value="Shipped" ${o.status==='Shipped'?'selected':''}>Shipped</option>
                  <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                  <option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
                </select>
                <button onclick="deleteOrder(${o.id})" style="background:red; color:white; border:none; padding:5px 10px; margin-left:10px; cursor:pointer;">Delete Order</button>
              </p>
            </div>
          `;
        });
      });
    }

    function updateStatus(orderId, status) {
      fetch('/api/admin/update-status', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ orderId, status })
      }).then(() => alert("Status updated successfully!"));
    }

    function deleteOrder(orderId) {
      if(confirm("Are you sure you want to delete this order?")) {
        fetch(`/api/admin/delete-order/${orderId}`, {method: 'DELETE'})
        .then(() => {
          alert("Order Deleted");
          loadAdminOrders();
        });
      }
    }

    function addNewProduct(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('name', document.getElementById('p-name').value);
      formData.append('category', document.getElementById('p-cat').value);
      formData.append('price', document.getElementById('p-price').value);
      formData.append('discountPrice', document.getElementById('p-disc').value);
      formData.append('description', document.getElementById('p-desc').value);

      const img1 = document.getElementById('p-img1').files[0];
      const img2 = document.getElementById('p-img2').files[0];

      if(img1) formData.append('img1', img1);
      if(img2) formData.append('img2', img2);

      fetch('/api/add-product', {
        method: 'POST',
        body: formData
      }).then(res => res.json()).then(data => {
        if(data.status === 'success') {
          alert("Product added successfully with photo!");
          location.reload();
        }
      });
    }

    function logoutAdmin() {
      fetch('/api/logout', {method: 'POST'}).then(() => window.location.href = '/');
    }
  </script>
</body>
          </html>
